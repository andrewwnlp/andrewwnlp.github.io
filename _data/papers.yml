- title: "Hell or High Water: Evaluating Agentic Recovery from External Failures"
  url: "https://arxiv.org/abs/2508.11027"
  authors: "<em>Andrew Wang</em>, Sophia Hager, Adi Asija, Daniel Khashabi, Nicholas Andrews."
  venue: "COLM"
  year: 2025
  selected: true
  blurb: 
    "How good are agents at coming up with backup plans when the tools they rely
    on stop working? We create a benchmark where each task is solvable with two
    different sets of tools, so that one broken tool never makes the task
    impossible. We find that LLMs struggle in this setting,
    and more available tools makes their performance even worse."
  thumb: "tool-use-figure-1.png"
  tweet: "https://x.com/andrewwnlp/status/1968727859955917019"
  code: "https://github.com/JHU-CLSP/hell-or-high-water"

