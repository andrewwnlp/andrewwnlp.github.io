# One entry per paper, newest first. This is the single source for both the
# "Selected work" section and the full list below it.
#
# Required on every entry:
#   title:           -> plain text; rendered bold and dark, not itself a link
#   url:             -> landing page, not a PDF (arXiv /abs, OpenReview, publisher)
#   authors:         -> HTML; <em>Andrew Wang</em> for me, * for equal contribution
#   venue:           -> "COLM", "NeurIPS", "ACL (main)", "TACL", "Arxiv preprint"
#   year:            -> four-digit number
#
# Optional:
#   selected: true   -> also appears up top, with its blurb and thumbnail
#   blurb:           -> two sentences; only used in the selected section
#   thumb:           -> file in assets/img/papers/; omit for a plain placeholder
#   site:            -> project page
#   code:            -> repository
#   data:            -> dataset or model weights, if hosted apart from the code
#   tweet:           -> thread announcing the paper
#
# Each entry renders a link row: "paper" (pointing at url:) followed by
# whichever of site / code / data / tweet are present, in that order.
# To omit any optional key, delete it or leave its value blank -- but never
# write thumb: "" or code: "". Liquid treats only false and nil as falsy, so
# an empty string still renders: a dead link, or an <img> with no filename.

- title: "Better, Faster, Stronger: Programmatic Skill Learning Best Reduces Agent Cost"
  url: "https://arxiv.org/abs/2608.11338"
  authors: "Zixi Huang,* Xiheng Wang,* <em>Andrew Wang</em>*, William Jurayj, Bernal Jiménez Gutiérrez, Daniel Khashabi, Nicholas Andrews"
  venue: "Arxiv preprint"
  year: 2026
  code: "https://github.com/JHU-CLSP/speedrunner"
  thumb: "better-faster-stronger.gif"
  tweet: "https://x.com/andrewwnlp/status/2089771876780306582"
  site: https://jhu-clsp.github.io/speedrunner/
  selected: true
  blurb: 
    "Agents should become more efficient as they gain more task experience. To 
    that end, we argue that the modality of code is an effective
    representation of experience. Codifying common behavior into programs
    avoids calling an LLM to re-reason every step. We show that across models
    and embodied tasks, our approach decreases cost more than text-based skill
    memory while matching performance."

