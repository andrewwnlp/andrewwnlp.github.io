# Builds the site with our own Gemfile and publishes it to GitHub Pages.
#
# This replaces Pages' built-in Jekyll build, which is pinned to Jekyll 3.9
# and a fixed plugin allowlist. Hosting is unchanged -- the site still serves
# from https://andrewwnlp.github.io/ -- but the Ruby and gem versions here are
# the same ones used locally, so a local `jekyll serve` matches production.
#
# Requires, once: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". Until that is set, this workflow runs but the old builder
# keeps serving the site.

name: Deploy site

# Build on every branch so a push is a real check of the site; only main
# is allowed to publish. That makes `git push dev` a staging gate that needs
# no local Ruby.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a queued one supersedes an in-flight one.
# Per-branch, so a dev build never cancels a main deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
